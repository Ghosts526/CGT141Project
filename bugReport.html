<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Operation Breakpoint: Bug Report</title>
    <link rel="stylesheet" href="css/master.css">
    <link rel="stylesheet" href="css/forms.css">
</head>
<body>
    <header>
        <h1>Bug Report</h1>
    </header>

    <main id="content">
        <a href="index.html" class="buttonLink smallButton" id="headerLeft">Back</a>
        <fieldset>
            <legend>Report a Bug Form</legend>

            <form action="bugReportSubmit.php" method="POST"> 
                <label for="name">Name: </label>
                <input type="text" id="name" name="name" autocomplete="off" required>

                <label for="email">Email: </label>
                <input type="email" id="email" name="email" autocomplete="off" required>

                <label for="bugType">Bug Type: </label>
                <select id="bugType" name="bugType">
                    <option value="Gameplay/Mechanics">Gameplay/Mechanics</option>
                    <option value="User Interface">User Interface</option>
                    <option value="Performance">Performance</option>
                    <option value="Visual/Graphics">Visual/Graphics</option>
                    <option value="Audio">Audio</option>
                    <option value="Rendering">Rendering</option>
                    <option value="Others">Others (Please Describe)</option>
                </select>

                <label for="subject">Subject: </label>
                <input id="subject" name="subject" required placeholder="Short Description"></input>

                <label for="description">Description: </label>
                <textarea id="description" name="description" required placeholder="Please describe the problem/issue you are encountering, what steps you took that caused the issue, and what device you are using."></textarea>
                
                <input type="submit" value="Submit">
            </form>
        </fieldset>
    </main>

    <div id="rotate">
        <img src="images/RotateScreen.gif" alt="rotateScreen">
        <p id="rotateMessage">Rotate Device</p>
    </div>
</body>
</html>
