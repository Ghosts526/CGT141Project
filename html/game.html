<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Operation Breakpoint: Game</title>
    <link rel="stylesheet" href="css/master.css">
    <link rel="stylesheet" href="css/game.css">
    <script type="module" src="js/Game.js" defer></script>
</head>
<body>
    <header>
        <h1 class="hidden">Game Screen</h1>
    </header>

    <main>
        <canvas id="gameScreen"></canvas>

        <nav class="uiButtons" id="uiNav">
            <button class="button mediumButton" id="pauseButton" onclick="pauseGame()" type="button">Resume Game</button>
            <button class="button mediumButton" id="gameButton" onclick="startGame()" type="button">Start Game</button>
            <button class="button mediumButton" id="menuButton" onclick="gameMenu()" type="button">Exit</button>
        </nav>
    </main>

    <div id="rotate">
        <img src="images/RotateScreen.gif" alt="rotateScreen">
        <p id="rotateMessage">Rotate Device</p>
    </div>
</body>
</html>
